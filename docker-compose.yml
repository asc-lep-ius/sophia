# Default:  docker compose up
# GPU:      docker compose --profile gpu up sophia-gui-gpu
# CLI:      docker compose --profile cli up

x-sophia-env: &sophia-env
  env_file:
    - path: .env
      required: false

x-api-healthcheck: &api-healthcheck
  test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
  interval: 30s
  timeout: 5s
  retries: 3
  start_period: 10s

x-gui-common: &gui-common
  <<: *sophia-env
  volumes:
    - sophia-data:/data
    - model-cache:/home/sophia/.cache/huggingface
    - ${SOPHIA_CONFIG_DIR:-~/.config/sophia}:/config
  environment:
    - SOPHIA_GUI_HOST=0.0.0.0
    - SOPHIA_GUI_PORT=8080
    - SOPHIA_DATA_DIR=/data
    - SOPHIA_CONFIG_DIR=/config
    - SOPHIA_LOG_FORMAT=json
    - SOPHIA_DOCKER=1
    - HF_HOME=/home/sophia/.cache/huggingface
  restart: unless-stopped
  networks:
    - backend
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  stop_grace_period: 15s
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health')"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  proxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    image: sophia-proxy:caddy-2.11.3-ratelimit-16aecbbcb8ca
    restart: unless-stopped
    ports:
      - "${SOPHIA_PROXY_HTTP_PORT:-80}:80/tcp"
      - "${SOPHIA_PROXY_HTTPS_PORT:-443}:443/tcp"
      - "${SOPHIA_PROXY_HTTPS_PORT:-443}:443/udp"
    environment:
      - SOPHIA_SITE_ADDRESS=${SOPHIA_SITE_ADDRESS:-http://localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_started
      api:
        condition: service_started
      sophia-gui:
        condition: service_started
    networks:
      - frontend
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: sophia-frontend:latest
    restart: unless-stopped
    environment:
      - HOST=0.0.0.0
      - PORT=3000
      - ORIGIN=${SOPHIA_FRONTEND_ORIGIN:-http://localhost}
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - PUBLIC_API_BASE_URL=/api
    expose:
      - "3000"
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/app/').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.6.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    <<: *sophia-env
    build:
      context: .
      dockerfile: Dockerfile
    image: sophia-api:latest
    entrypoint: ["/app/.venv/bin/uvicorn"]
    command: ["sophia.api.app:create_standalone_api_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped
    environment:
      - SOPHIA_DATA_DIR=/data
      - SOPHIA_CONFIG_DIR=/config
      - SOPHIA_LOG_FORMAT=json
      - SOPHIA_DOCKER=1
      - SOPHIA_REDIS_URL=redis://redis:6379/0
    volumes:
      - sophia-data:/data
      - ${SOPHIA_CONFIG_DIR:-~/.config/sophia}:/config
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend
    healthcheck: *api-healthcheck
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s

  sophia-gui:
    <<: *gui-common
    ports:
      - "${SOPHIA_GUI_PORT:-8080}:8080"
    build:
      context: .
      dockerfile: Dockerfile.gui
    image: sophia-gui:latest
    deploy:
      resources:
        limits:
          memory: 4g
          cpus: "1.0"

  sophia-gui-gpu:
    <<: *gui-common
    profiles: ["gpu"]
    ports:
      - "${SOPHIA_GUI_PORT:-8080}:8080"
    build:
      context: .
      dockerfile: Dockerfile.gui.cuda
    image: sophia-gui:cuda
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  sophia:
    <<: *sophia-env
    profiles: ["cli"]
    build: .
    environment:
      - TERM=xterm-256color
      - LANG=C.UTF-8
      - SOPHIA_DATA_DIR=/data
    volumes:
      - sophia-data:/data
      - ./downloads:/app/downloads
    networks:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    stop_grace_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "1.0"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import sqlite3; sqlite3.connect('/data/sophia.db').execute('SELECT 1')"]
      interval: 30s
      retries: 3

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    profiles: ["scraping"]
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8191"]
      interval: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  sophia-data:
  model-cache:
  redis-data:
  caddy-data:
  caddy-config:

networks:
  frontend:
  backend:
