# Sophia CI - local GitLab runners + registry
#
# Docker builds use BuildKit (docker buildx) via DinD on the privileged runner.
# Registry: gitlab.hephaestus:5050 (HTTP, insecure).
# Tags: hephaestus (check), privileged (docker builds).

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "web"'
    - when: never

variables:
  LOCAL_REGISTRY: "gitlab.hephaestus:5050/mipkovich/sophia"
  # The frontend CI image this commit expects: the first 16 hex of the sha256 of
  # ci/Dockerfile.frontend and frontend/pnpm-lock.yaml concatenated.
  #
  # Written down rather than computed, because the runner expands `image:` from
  # .gitlab-ci.yml variables, project/group variables and predefined ones only.
  # A value handed over by an earlier job is a dotenv *artifact*, which is not in
  # that set -- GitLab's documented way to get a computed name into `image:` is a
  # dynamic child pipeline, which is a great deal of machinery for one tag.
  #
  # Nobody has to remember to bump it: scripts/frontend_ci_image.py --check
  # recomputes the hash on every pipeline and prints the value to paste.
  FRONTEND_CI_TAG: "62f69fa2ab0c6276"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  PNPM_STORE_PATH: "$CI_PROJECT_DIR/.cache/pnpm"

stages:
  - rebuild-ci
  - check
  - build
  - deploy

.optional-manual-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master"'
      when: manual
      allow_failure: true
    - when: never

# --- Docker build template (BuildKit + DinD) ---
.docker-build:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=gitlab.hephaestus:5050"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - printf '%s' "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - |
      cat > /tmp/buildkitd.toml << EOF
      [registry."gitlab.hephaestus:5050"]
        http = true
      EOF
    - docker buildx create --use --name ci-builder --driver docker-container --driver-opt network=host --config /tmp/buildkitd.toml
    - docker buildx inspect --bootstrap
  after_script:
    - docker buildx rm ci-builder 2>/dev/null || true
  tags: [privileged]

# --- CI image rebuild ---
.ci-rebuild-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    # allow_failure: this job only refreshes a cache. It sits in the first
    # stage, so without it a registry outage skips every check behind it and
    # master merges unverified -- which is exactly what happened on 2026-08-28.
    # The check jobs run `uv sync --frozen` regardless, so a stale ci:latest
    # makes them slower, never wrong.
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - ci/Dockerfile.ci
        - pyproject.toml
        - uv.lock
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ci/Dockerfile.ci
        - pyproject.toml
        - uv.lock
      when: manual
      allow_failure: true
    - when: never

rebuild-ci-image:
  stage: rebuild-ci
  extends:
    - .docker-build
    - .ci-rebuild-rules
  script:
    - CI_HASH=$(cat ci/Dockerfile.ci pyproject.toml uv.lock | sha256sum | cut -c1-16)
    - docker buildx build --file ci/Dockerfile.ci --cache-from type=registry,ref=${LOCAL_REGISTRY}/ci-cache --cache-to type=registry,ref=${LOCAL_REGISTRY}/ci-cache,mode=max --tag ${LOCAL_REGISTRY}/ci:${CI_HASH} --tag ${LOCAL_REGISTRY}/ci:latest --push .

# --- Frontend CI image rebuild ---
.frontend-ci-rebuild-rules:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    # The same two files FRONTEND_CI_TAG is the hash of: when they move the tag
    # moves, and the image that tag names does not exist until this job builds
    # it. So the merge request arm runs on its own rather than waiting to be
    # clicked -- a branch that bumps the lockfile cannot go green without it,
    # and there is no longer a shared tag for that build to disturb.
    #
    # allow_failure survives from .ci-rebuild-rules, with a narrower meaning
    # worth stating: it no longer keeps the frontend jobs running, since a build
    # that failed leaves nothing for them to pull. What it still does is let
    # lint, typecheck, test:3.12 and the policy jobs report, instead of one
    # registry outage in the first stage costing every signal in the pipeline.
    - if: '$CI_COMMIT_BRANCH == "master"'
      changes:
        - ci/Dockerfile.frontend
        - frontend/pnpm-lock.yaml
      allow_failure: true
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - ci/Dockerfile.frontend
        - frontend/pnpm-lock.yaml
      allow_failure: true
    - when: never

rebuild-frontend-ci-image:
  stage: rebuild-ci
  extends:
    - .docker-build
    - .frontend-ci-rebuild-rules
  script:
    # One tag, and no :latest. A moving tag is the whole of #113: a branch that
    # rebuilt used to overwrite what master's next pipeline would pull, handing
    # master a browser set master's own lockfile never asked for and reddening
    # three jobs for something master did not do.
    - docker buildx build --file ci/Dockerfile.frontend --cache-from type=registry,ref=${LOCAL_REGISTRY}/frontend-ci-cache --cache-to type=registry,ref=${LOCAL_REGISTRY}/frontend-ci-cache,mode=max --tag ${LOCAL_REGISTRY}/frontend-ci:${FRONTEND_CI_TAG} --push .

# --- Pre-built CI image template ---
.python-job:
  image: "${LOCAL_REGISTRY}/ci:latest"
  variables:
    UV_LINK_MODE: copy
    UV_PROJECT_ENVIRONMENT: /app/.venv
  cache:
    key:
      prefix: uv
      files:
        - uv.lock
    paths:
      - .cache/pip/
      - .cache/uv/
  before_script:
    - uv sync --frozen --extra test --group dev

# --- Postgres service for database-backed tests ---
# Pinned by digest so a re-tagged 18.4 cannot change what CI proves.
.postgres-service:
  services:
    - name: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
      alias: postgres
  variables:
    POSTGRES_USER: sophia
    POSTGRES_PASSWORD: sophia
    POSTGRES_DB: sophia_test
    POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    SOPHIA_TEST_DATABASE_URL: "postgresql+asyncpg://sophia:sophia@postgres:5432/sophia_test"

# --- Blocking merge gate ---
lint:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run ruff check .
    - uv run ruff format --check .

typecheck:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run pyright

test:3.12:
  stage: check
  tags: [hephaestus]
  extends:
    - .python-job
    - .postgres-service
  script:
    - uv run pytest --tb=short -q --cov=src/sophia --cov-report=term --cov-report=xml --junitxml=pytest.xml --cov-fail-under=85
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)/'
  artifacts:
    when: always
    reports:
      junit: pytest.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
    paths:
      - pytest.xml
      - coverage.xml
    expire_in: 1 week

openapi-check:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run python scripts/export_openapi.py --check

blocking-audit:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run python scripts/blocking_audit.py --check

secret-policy:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run python scripts/secret_policy.py --check

deployment-policy:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run python scripts/deployment_policy.py --check

# On .python-job, not .frontend-job: a job whose whole purpose is to report that
# the frontend image tag is wrong cannot be one that has to pull that image to
# start. test:3.12 covers the same check through tests/api/test_frontend_ci_image.py,
# but it is a two-minute job, and a stale tag otherwise surfaces as nine jobs
# failing to pull a tag that "does not exist" -- true, unhelpful, and 30 seconds
# from the answer this prints.
frontend-image-tag:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run python scripts/frontend_ci_image.py --check

compose-config:
  stage: check
  image: docker:27-cli
  tags: [privileged]
  # Production requires these to be set explicitly, so the syntax check supplies
  # placeholders the same way it already does for IMAGE_TAG. A real deployment
  # still fails loudly if any of them is missing.
  variables:
    SOPHIA_POSTGRES_USER: ci-syntax-check
    SOPHIA_POSTGRES_PASSWORD: ci-syntax-check
    SOPHIA_POSTGRES_DB: ci-syntax-check
    SOPHIA_BACKUP_URL: postgresql://ci-syntax-check@postgres:5432/ci-syntax-check
  script:
    - docker compose config
    - IMAGE_TAG="$CI_COMMIT_SHA" docker compose -f docker-compose.prod.yml config

.frontend-job:
  stage: check
  # The runner's allowed_images still does not include mcr.microsoft.com, so the
  # official Playwright image cannot be pulled here -- ci/Dockerfile.frontend
  # builds the equivalent into the local registry instead. Three jobs need a
  # browser now rather than one. On pipeline 469 those three jobs were 550.3s of
  # the pipeline's 1012s of job time -- 54% -- and each paid the Chromium
  # download and its apt install separately. That install is what moves into the
  # image; the specs themselves still cost what they cost.
  image:
    name: "${LOCAL_REGISTRY}/frontend-ci:${FRONTEND_CI_TAG}"
    # if-not-present, and that is now the whole story. The tag names one
    # immutable image, so re-checking the registry every job would only confirm
    # what a runner already holds. `always` was needed while this said :latest,
    # and with it goes the allowed_pull_policies prerequisite #112 put on the
    # hephaestus runner: if-not-present is the runner's own default, so a fresh
    # runner needs no configuration to run these jobs.
    pull_policy: [if-not-present]
  tags: [hephaestus]
  cache:
    key:
      prefix: pnpm
      files:
        - frontend/pnpm-lock.yaml
    paths:
      - .cache/pnpm/
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.3.0 --activate
    - pnpm -C frontend install --frozen-lockfile --store-dir "$PNPM_STORE_PATH"

frontend-contract-guards:
  extends: .frontend-job
  script:
    - pnpm -C frontend run guard:package-contract
    - pnpm -C frontend run guard:server-fetch
    - pnpm -C frontend run guard:openapi-types
    - pnpm -C frontend run guard:api-client

frontend-paraglide:
  extends: .frontend-job
  script:
    - pnpm -C frontend run paraglide:check

frontend-check:
  extends: .frontend-job
  script:
    - pnpm -C frontend run check

frontend-lint:
  extends: .frontend-job
  script:
    - pnpm -C frontend run lint

frontend-unit:
  extends: .frontend-job
  script:
    - pnpm -C frontend run test:unit

frontend-size:
  extends: .frontend-job
  script:
    - pnpm -C frontend run size-limit

# The three browser jobs. Chromium comes from the image rather than from a
# per-run install; `test:e2e` checks it is the build this lockfile's Playwright
# expects before it starts. All this adds is the traces to read when a spec
# fails, which was copied into each of the three.
.playwright-job:
  extends: .frontend-job
  artifacts:
    when: on_failure
    paths:
      - frontend/test-results/
      - frontend/playwright-report/
    expire_in: 1 week

# The reflow and accessibility gate. high-traffic-mobile.spec.ts belongs with
# the other two rather than with the study specs: it checks the same property
# at 375 px that de-overflow checks at 320 px, and a page that passes axe on a
# desktop and overflows on a phone has not passed anything.
frontend-a11y:
  extends: .playwright-job
  script:
    - >
      pnpm -C frontend run test:e2e --
      a11y.spec.ts de-overflow.spec.ts high-traffic-mobile.spec.ts

# The pedagogy gate. study-pacing.spec.ts fails when productive friction is
# shortened, and study-latency.spec.ts measures the keyboard flow under CPU
# throttling against a fixed fixture deck — neither number means anything
# without the other job's, so they run together.
frontend-study-e2e:
  extends: .playwright-job
  script:
    - >
      pnpm -C frontend run test:e2e --
      study-pacing.spec.ts study-latency.spec.ts study-mobile.spec.ts

# The migrated-surface gate. Every non-study surface that carries its own
# happy, error and mobile paths runs here rather than in the a11y job: that one
# checks one property across many routes, this one checks many properties per
# route, and mixing them makes a red job ambiguous.
#
# The spec list is explicit, as it is in the two jobs above, so a spec that is
# never added stays invisible. That is how long-tail.spec.ts came to exist for
# a whole phase without CI running it once. content-topics.spec.ts and
# shell.spec.ts are still in that position and belong here too; they are left
# out only because adopting another phase's gate inside this one risks turning
# this job red for reasons #101 did not cause.
frontend-surface-e2e:
  extends: .playwright-job
  script:
    - >
      pnpm -C frontend run test:e2e --
      long-tail.spec.ts

# --- Optional checks ---
test:3.14:
  stage: check
  tags: [hephaestus]
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  extends:
    - .optional-manual-rules
    - .postgres-service
  variables:
    UV_LINK_MODE: copy
  cache:
    key:
      prefix: uv-py314
      files:
        - uv.lock
    paths:
      - .cache/uv/
  script:
    - uv sync --frozen --extra test --group dev
    - uv run pytest tests/ -x --tb=short
  allow_failure: true

dependency-audit:
  stage: check
  tags: [hephaestus]
  extends:
    - .python-job
    - .optional-manual-rules
  script:
    - uv run pip-audit
  allow_failure: true

# --- Build stage ---
docker-api-build:
  stage: build
  extends: .docker-build
  script:
    - docker buildx build --file Dockerfile --cache-from type=registry,ref=${LOCAL_REGISTRY}/api-cache --cache-to type=registry,ref=${LOCAL_REGISTRY}/api-cache,mode=max --tag ${LOCAL_REGISTRY}/api:${CI_COMMIT_SHA} --push .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile
        - docker-compose.yml
        - docker-compose.prod.yml
        - pyproject.toml
        - uv.lock
        - src/**/*
      when: manual
      allow_failure: true
    - when: never

docker-frontend-build:
  stage: build
  extends: .docker-build
  script:
    - docker buildx build --file Dockerfile.frontend --cache-from type=registry,ref=${LOCAL_REGISTRY}/frontend-cache --cache-to type=registry,ref=${LOCAL_REGISTRY}/frontend-cache,mode=max --tag ${LOCAL_REGISTRY}/frontend:${CI_COMMIT_SHA} --push .
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - Dockerfile.frontend
        - docker-compose.yml
        - docker-compose.prod.yml
        - frontend/**/*
      when: manual
      allow_failure: true
    - when: never

docker-proxy-build:
  stage: build
  extends: .docker-build
  script:
    - docker buildx build --file proxy/Dockerfile --cache-from type=registry,ref=${LOCAL_REGISTRY}/proxy-cache --cache-to type=registry,ref=${LOCAL_REGISTRY}/proxy-cache,mode=max --tag ${LOCAL_REGISTRY}/proxy:${CI_COMMIT_SHA} --push proxy
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: manual
      allow_failure: true
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - proxy/**/*
        - docker-compose.yml
        - docker-compose.prod.yml
      when: manual
      allow_failure: true
    - when: never

deploy:production:
  stage: deploy
  image: python:3.12-alpine
  tags: [hephaestus]
  resource_group: production
  needs:
    - docker-proxy-build
    - docker-api-build
    - docker-frontend-build
  variables:
    IMAGE_TAG: $CI_COMMIT_SHA
  before_script:
    - apk add --no-cache openssh-client
  script:
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_PATH"
    - test -n "$SOPHIA_PRODUCTION_URL"
    - test -n "$CI_COMMIT_SHA"
    - ssh "$DEPLOY_HOST" "cd '$DEPLOY_PATH' && LOCAL_REGISTRY='${LOCAL_REGISTRY}' IMAGE_TAG='${CI_COMMIT_SHA}' docker compose -f docker-compose.prod.yml pull && LOCAL_REGISTRY='${LOCAL_REGISTRY}' IMAGE_TAG='${CI_COMMIT_SHA}' docker compose -f docker-compose.prod.yml up -d --remove-orphans"
    - python3 scripts/deploy_smoke.py --base-url "$SOPHIA_PRODUCTION_URL" --sse-path "${SOPHIA_SMOKE_SSE_PATH:-/api/events}"
  environment:
    name: production
    url: $SOPHIA_PRODUCTION_URL
    deployment_tier: production
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
    - when: never
