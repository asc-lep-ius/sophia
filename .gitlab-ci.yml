# Sophia CI — local GitLab runners + registry
#
# Docker builds use BuildKit (docker buildx) via DinD on the privileged runner.
# Registry: gitlab.hephaestus:5050 (HTTP, insecure).
# Tags: hephaestus (check), privileged (docker builds).

variables:
  LOCAL_REGISTRY: "gitlab.hephaestus:5050/mipkovich/sophia"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - rebuild-ci
  - check
  - build
  - deploy

# --- Docker build template (BuildKit + DinD) ---
.docker-build:
  image: docker:27-cli
  services:
    - name: docker:27-dind
      command: ["--insecure-registry=gitlab.hephaestus:5050"]
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - |
      cat > /tmp/buildkitd.toml << EOF
      [registry."gitlab.hephaestus:5050"]
        http = true
      EOF
    - docker buildx create --use --name ci-builder
        --driver docker-container
        --driver-opt network=host
        --config /tmp/buildkitd.toml
    - docker buildx inspect --bootstrap
  after_script:
    - docker buildx rm ci-builder 2>/dev/null || true
  tags: [privileged]

# --- CI image rebuild ---
.ci-rebuild-rules:
  rules:
    - changes:
        - ci/Dockerfile.ci
        - pyproject.toml
        - uv.lock
    - when: manual
      allow_failure: true

rebuild-ci-image:
  stage: rebuild-ci
  extends:
    - .docker-build
    - .ci-rebuild-rules
  script:
    - CI_HASH=$(cat ci/Dockerfile.ci pyproject.toml uv.lock | sha256sum | cut -c1-16)
    - docker buildx build
        --file ci/Dockerfile.ci
        --cache-from type=registry,ref=${LOCAL_REGISTRY}/ci-cache
        --cache-to type=registry,ref=${LOCAL_REGISTRY}/ci-cache,mode=max
        --tag ${LOCAL_REGISTRY}/ci:${CI_HASH}
        --tag ${LOCAL_REGISTRY}/ci:latest
        --push .

# --- Pre-built CI image template ---
.python-job:
  image: "${LOCAL_REGISTRY}/ci:latest"
  variables:
    UV_LINK_MODE: copy
    UV_PROJECT_ENVIRONMENT: /app/.venv
  before_script:
    - uv sync --extra web --extra test --group dev

# --- Check stage ---
lint:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run ruff check src/ tests/
    - uv run ruff format --check src/ tests/

typecheck:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run pyright src/

api-tests:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run pytest tests/api/ -q

api-contracts:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run pytest tests/api/contracts/ -q
    - uv run python scripts/export_openapi.py --check

blocking-audit:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run python scripts/blocking_audit.py --check

compose-config:
  stage: check
  image: docker:27-cli
  tags: [privileged]
  script:
    - docker compose config
    - docker compose -f docker-compose.prod.yml config

.frontend-job:
  stage: check
  image: mcr.microsoft.com/playwright:v1.60.0-noble
  tags: [hephaestus]
  before_script:
    - corepack enable
    - corepack prepare pnpm@11.3.0 --activate
    - pnpm -C frontend install --frozen-lockfile

frontend-lint:
  extends: .frontend-job
  script:
    - pnpm -C frontend run lint

frontend-check:
  extends: .frontend-job
  script:
    - pnpm -C frontend run check

frontend-unit:
  extends: .frontend-job
  script:
    - pnpm -C frontend run test:unit

frontend-size:
  extends: .frontend-job
  script:
    - pnpm -C frontend run size-limit

frontend-a11y:
  extends: .frontend-job
  script:
    - pnpm -C frontend run test:e2e -- a11y.spec.ts de-overflow.spec.ts

test:3.12:
  stage: check
  tags: [hephaestus]
  extends: .python-job
  script:
    - uv run pytest tests/ -x --tb=short --cov=sophia --cov-report=term
  coverage: '/^TOTAL\s+\d+\s+\d+\s+(\d+%)/' 

test:3.14:
  stage: check
  tags: [hephaestus]
  image: ghcr.io/astral-sh/uv:python3.14-bookworm-slim
  script:
    - uv sync --extra web --extra test
    - uv run pytest tests/ -x --tb=short
  allow_failure: true

# --- Build stage ---
docker-api-build:
  stage: build
  extends: .docker-build
  script:
    - docker buildx build
        --file Dockerfile
        --cache-from type=registry,ref=${LOCAL_REGISTRY}/api-cache
        --cache-to type=registry,ref=${LOCAL_REGISTRY}/api-cache,mode=max
        --tag ${LOCAL_REGISTRY}/api:${CI_COMMIT_SHA}
        --push .
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - changes:
        - Dockerfile
        - pyproject.toml
        - uv.lock
        - src/**/*

docker-frontend-build:
  stage: build
  extends: .docker-build
  script:
    - docker buildx build
        --file Dockerfile.frontend
        --cache-from type=registry,ref=${LOCAL_REGISTRY}/frontend-cache
        --cache-to type=registry,ref=${LOCAL_REGISTRY}/frontend-cache,mode=max
        --tag ${LOCAL_REGISTRY}/frontend:${CI_COMMIT_SHA}
        --push .
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - changes:
        - Dockerfile.frontend
        - frontend/**/*

docker-nicegui-build:
  stage: build
  extends: .docker-build
  script:
    - docker buildx build
        --file Dockerfile.nicegui
        --cache-from type=registry,ref=${LOCAL_REGISTRY}/nicegui-cache
        --cache-to type=registry,ref=${LOCAL_REGISTRY}/nicegui-cache,mode=max
        --tag ${LOCAL_REGISTRY}/nicegui:${CI_COMMIT_SHA}
        --push .
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
    - changes:
        - Dockerfile.nicegui
        - pyproject.toml
        - uv.lock
        - src/**/*

docker-gui-build-gpu:
  stage: build
  extends: .docker-build
  timeout: 3h
  script:
    - GPU_HASH=$(cat Dockerfile.gui.cuda pyproject.toml uv.lock | sha256sum | cut -c1-16)
    - docker buildx build
        --file Dockerfile.gui.cuda
        --cache-from type=registry,ref=${LOCAL_REGISTRY}/gui-cuda-cache
        --cache-to type=registry,ref=${LOCAL_REGISTRY}/gui-cuda-cache,mode=max
        --tag ${LOCAL_REGISTRY}/gui-cuda:${GPU_HASH}
        --tag ${LOCAL_REGISTRY}/gui-cuda:latest
        --push .
  rules:
    - changes:
        - Dockerfile.gui.cuda
        - pyproject.toml
        - uv.lock
        - src/**/*

deploy:production:
  stage: deploy
  image: alpine:3.22
  tags: [hephaestus]
  needs:
    - docker-api-build
    - docker-frontend-build
    - docker-nicegui-build
  variables:
    IMAGE_TAG: $CI_COMMIT_SHA
  before_script:
    - apk add --no-cache openssh-client
  script:
    - test -n "$DEPLOY_HOST"
    - test -n "$DEPLOY_PATH"
    - test -n "$CI_COMMIT_SHA"
    - ssh "$DEPLOY_HOST" "cd '$DEPLOY_PATH' && LOCAL_REGISTRY='${LOCAL_REGISTRY}' IMAGE_TAG='${CI_COMMIT_SHA}' docker compose -f docker-compose.prod.yml pull && LOCAL_REGISTRY='${LOCAL_REGISTRY}' IMAGE_TAG='${CI_COMMIT_SHA}' docker compose -f docker-compose.prod.yml up -d --remove-orphans"
  environment:
    name: production
  rules:
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
