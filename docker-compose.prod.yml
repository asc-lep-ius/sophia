# Production app and proxy images are pinned through IMAGE_TAG. Use
# `make docker-prod-config` for local validation; that target supplies the
# current git commit SHA.
services:
  proxy:
    image: "${LOCAL_REGISTRY:-gitlab.hephaestus:5050/mipkovich/sophia}/proxy:${IMAGE_TAG:?set IMAGE_TAG to a full commit SHA}"
    restart: unless-stopped
    ports:
      - "${SOPHIA_PROXY_HTTP_PORT:-80}:80/tcp"
      - "${SOPHIA_PROXY_HTTPS_PORT:-443}:443/tcp"
      - "${SOPHIA_PROXY_HTTPS_PORT:-443}:443/udp"
    environment:
      SOPHIA_SITE_ADDRESS: ${SOPHIA_SITE_ADDRESS:-https://sophia.example.com}
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      frontend:
        condition: service_healthy
      api:
        condition: service_healthy
      sophia-gui:
        condition: service_healthy
    networks:
      - public
      - app
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  frontend:
    image: "${LOCAL_REGISTRY:-gitlab.hephaestus:5050/mipkovich/sophia}/frontend:${IMAGE_TAG:?set IMAGE_TAG to a full commit SHA}"
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      ORIGIN: ${SOPHIA_FRONTEND_ORIGIN:-https://sophia.example.com}
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      PUBLIC_API_BASE_URL: /api
      SOPHIA_API_BASE_URL: http://api:8000
    expose:
      - "3000"
    networks:
      - app
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/app/').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  api:
    image: "${LOCAL_REGISTRY:-gitlab.hephaestus:5050/mipkovich/sophia}/api:${IMAGE_TAG:?set IMAGE_TAG to a full commit SHA}"
    restart: unless-stopped
    entrypoint: ["/app/.venv/bin/uvicorn"]
    command: ["sophia.api.app:create_standalone_api_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SOPHIA_PRODUCTION: "true"
      SOPHIA_DATA_DIR: /data
      SOPHIA_CONFIG_DIR: /config
      SOPHIA_LOG_FORMAT: json
      SOPHIA_SECRET_KEY_CURRENT: ${SOPHIA_SECRET_KEY_CURRENT:-}
      SOPHIA_SECRET_KEY_PREVIOUS: ${SOPHIA_SECRET_KEY_PREVIOUS:-}
      SOPHIA_DOCKER: "1"
      SOPHIA_REDIS_URL: redis://redis:6379/0
    volumes:
      - sophia-data:/data
      - sophia-config:/config
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  sophia-gui:
    image: "${LOCAL_REGISTRY:-gitlab.hephaestus:5050/mipkovich/sophia}/nicegui:${IMAGE_TAG:?set IMAGE_TAG to a full commit SHA}"
    restart: unless-stopped
    environment:
      SOPHIA_PRODUCTION: "true"
      SOPHIA_DATA_DIR: /data
      SOPHIA_CONFIG_DIR: /config
      SOPHIA_LOG_FORMAT: json
      SOPHIA_SECRET_KEY_CURRENT: ${SOPHIA_SECRET_KEY_CURRENT:-}
      SOPHIA_SECRET_KEY_PREVIOUS: ${SOPHIA_SECRET_KEY_PREVIOUS:-}
      SOPHIA_GUI_HOST: 0.0.0.0
      SOPHIA_GUI_PORT: "8080"
      SOPHIA_DOCKER: "1"
      SOPHIA_REDIS_URL: redis://redis:6379/0
      HF_HOME: /home/sophia/.cache/huggingface
    volumes:
      - sophia-data:/data
      - sophia-config:/config
      - model-cache:/home/sophia/.cache/huggingface
    expose:
      - "8080"
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  postgres:
    image: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${SOPHIA_POSTGRES_USER:?set SOPHIA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${SOPHIA_POSTGRES_PASSWORD:?set SOPHIA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${SOPHIA_POSTGRES_DB:?set SOPHIA_POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    expose:
      - "5432"
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres-backup:
    image: postgres@sha256:a02db8cac496f15b094798a38254f14d6e00741f709360e5e00bb6668ea31636
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    # No --no-sync: a dump that returns before it is on stable storage is a
    # promise, not a backup. Dumps are written to a local volume and are
    # expected to be shipped off-host encrypted; see DEPLOYMENT.md.
    command:
      - >-
        while true; do
        pg_dump --format=custom --compress=9 --no-owner --no-privileges
        --file=/backups/sophia-$$(date -u +%Y%m%dT%H%M%SZ).dump
        "$$SOPHIA_BACKUP_URL" || echo "pg_dump failed";
        find /backups -name 'sophia-*.dump' -mtime +$${SOPHIA_BACKUP_RETENTION_DAYS:-14} -delete;
        sleep $${SOPHIA_BACKUP_INTERVAL_SECONDS:-86400};
        done
    environment:
      SOPHIA_BACKUP_URL: ${SOPHIA_BACKUP_URL:?set SOPHIA_BACKUP_URL}
      SOPHIA_BACKUP_INTERVAL_SECONDS: ${SOPHIA_BACKUP_INTERVAL_SECONDS:-86400}
      SOPHIA_BACKUP_RETENTION_DAYS: ${SOPHIA_BACKUP_RETENTION_DAYS:-14}
    volumes:
      - postgres-backups:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "ls /backups/sophia-*.dump >/dev/null 2>&1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:8.6.3-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    expose:
      - "6379"
    networks:
      - data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  litestream:
    image: litestream/litestream:0.5.11
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        test -n "$$LITESTREAM_REPLICA_URL" &&
        test -n "$$LITESTREAM_ACCESS_KEY_ID" &&
        test -n "$$LITESTREAM_SECRET_ACCESS_KEY" &&
        exec litestream replicate /data/sophia.db "$$LITESTREAM_REPLICA_URL"
    environment:
      LITESTREAM_REPLICA_URL: ${LITESTREAM_REPLICA_URL:-}
      LITESTREAM_ACCESS_KEY_ID: ${LITESTREAM_ACCESS_KEY_ID:-}
      LITESTREAM_SECRET_ACCESS_KEY: ${LITESTREAM_SECRET_ACCESS_KEY:-}
      LITESTREAM_REGION: ${LITESTREAM_REGION:-auto}
      LITESTREAM_ENDPOINT: ${LITESTREAM_ENDPOINT:-}
    volumes:
      - sophia-data:/data:ro
      - litestream-state:/var/lib/litestream
    depends_on:
      api:
        condition: service_healthy
    networks:
      - data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -n \"$$LITESTREAM_REPLICA_URL\" && litestream snapshots \"$$LITESTREAM_REPLICA_URL\" >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  postgres-data:
  postgres-backups:
  sophia-data:
  sophia-config:
  model-cache:
  redis-data:
  caddy-data:
  caddy-config:
  litestream-state:

networks:
  public:
  app:
  data: